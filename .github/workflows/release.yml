name: Publish release

on:
  push:
    branches:
      - main
    paths:
      - manifest.json
      - main.lua
      - main_sandbox.lua
      - assets/**
      - overrides/**
      - mod.card
      - CHANGELOG.md
      - RELEASE_NOTES_*.md
      # export-ignore decides what `git archive` puts in the zip, so a change
      # here changes what players install and has to republish like any other.
      - .gitattributes
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gen1follower-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read and validate manifest
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool manifest.json >/dev/null
          VERSION=$(python3 -c 'import json; print(json.load(open("manifest.json", encoding="utf-8"))["version"])')
          ENTRY=$(python3 -c 'import json; print(json.load(open("manifest.json", encoding="utf-8"))["entry"])')
          python3 - <<'PY'
          import json, re
          m = json.load(open('manifest.json', encoding='utf-8'))
          version = m['version']
          # The version is the release identity: it names the tag, the archive
          # and the changelog entry. Validate its shape and its paper trail
          # instead of pinning one literal, so a bump is a single-file edit.
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), version
          changelog = open('CHANGELOG.md', encoding='utf-8').read()
          assert re.search(r'^## %s\b' % re.escape(version), changelog, re.M), \
              'CHANGELOG.md has no entry for %s' % version
          assert m['id'] == 'Gen1Follower', m['id']
          assert m['github'] == 'wild1walker/Gen1Follower', m['github']
          assert m['entry'] == 'main_sandbox.lua', m['entry']
          assert m.get('game_version') == '0.0.0-dev || >=0.1.86 <2.0.0'
          permissions = set(m.get('permissions') or [])
          assert 'filesystem' not in permissions
          assert permissions <= {'engine_internals'}
          assert set(m.get('games') or []) == {'gen1', 'gen2'}

          card = json.load(open('mod.card', encoding='utf-8'))
          assert card['version'] == version, (card['version'], version)
          PY
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "archive=Gen1Follower-$VERSION.zip" >> "$GITHUB_OUTPUT"
          echo "entry=$ENTRY" >> "$GITHUB_OUTPUT"

      - name: Install LuaJIT
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit

      - name: Validate sandbox source
        shell: bash
        run: |
          set -euo pipefail
          luajit -b main_sandbox.lua /tmp/gen1follower-sandbox.ljbc
          luajit -b main.lua /tmp/gen1follower-legacy.ljbc

          for pattern in 'love.filesystem' 'require("io")' 'require("debug")' 'require("package")' 'require("ffi")'; do
            if grep -R -n -F "$pattern" main_sandbox.lua main.lua; then
              echo "Raw sandbox-bypassing API detected: $pattern" >&2
              exit 1
            fi
          done

          grep -q -F 'mod:read("main.lua")' main_sandbox.lua
          grep -q -F 'mod.assets:path("assets/sprites/follower_004.png")' main_sandbox.lua
          grep -q -F 'PikachuFollower.setShouldSpawn' main_sandbox.lua
          grep -q -F 'resolveFollowerSprite' main_sandbox.lua
          grep -q -F 'providerRepository' main_sandbox.lua

          # The provider contract must advertise this repository, not the
          # upstream one it was branded away from.
          grep -q -F 'mod.exports.providerRepository = "wild1walker/Gen1Follower"' main_sandbox.lua

          # The follower renderer must never resolve an unhealthy mon, or a
          # fainted stored selection is drawn walking behind the player.
          if grep -n -F 'getActiveFollowerMon(liveGame(), false)' main.lua; then
            echo "render path resolves a possibly fainted follower" >&2
            exit 1
          fi

      - name: Build launcher archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="${{ steps.version.outputs.archive }}"
          STAGING="$RUNNER_TEMP/gen1follower-release"
          rm -rf "$STAGING" "$ARCHIVE"
          mkdir -p "$STAGING"
          git archive HEAD | tar -x -C "$STAGING"

          rm -rf "$STAGING/.github"
          rm -f "$STAGING/.gitignore" "$STAGING/.luarc.json" \
                "$STAGING/.modkitignore" "$STAGING/mod.zip"
          find "$STAGING" -type f -name '*Zone.Identifier' -delete

          (cd "$STAGING" && zip -qr "$GITHUB_WORKSPACE/$ARCHIVE" .)
          unzip -Z1 "$ARCHIVE" | grep -qx 'manifest.json'
          unzip -Z1 "$ARCHIVE" | grep -qx 'main_sandbox.lua'
          unzip -Z1 "$ARCHIVE" | grep -qx 'main.lua'
          if unzip -Z1 "$ARCHIVE" | grep -q 'Zone.Identifier'; then
            echo "Zone.Identifier metadata leaked into release" >&2
            exit 1
          fi
          if unzip -Z1 "$ARCHIVE" | grep -qx 'mod.zip'; then
            echo "stale tracked mod.zip leaked into release" >&2
            exit 1
          fi
          # The repository's own material -- the README's screenshots and the
          # engine-stubbing test harness -- is export-ignored in .gitattributes
          # and has no business in what a player unzips into mods/. Assert it
          # rather than trust the attribute, so dropping a line there fails the
          # release instead of quietly fattening it.
          for tree in docs tests; do
            if unzip -Z1 "$ARCHIVE" | grep -q "^$tree/"; then
              echo "$tree/ is export-ignored but reached the release" >&2
              exit 1
            fi
          done
          unzip -t "$ARCHIVE"

      - name: Validate exact release ZIP
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="${{ steps.version.outputs.archive }}"
          CHECK="$RUNNER_TEMP/gen1follower-release-check"
          rm -rf "$CHECK"
          mkdir -p "$CHECK"
          unzip -q "$ARCHIVE" -d "$CHECK"
          python3 -m json.tool "$CHECK/manifest.json" >/dev/null
          luajit -b "$CHECK/main_sandbox.lua" /tmp/gen1follower-release-sandbox.ljbc
          luajit -b "$CHECK/main.lua" /tmp/gen1follower-release-legacy.ljbc
          sha256sum "$ARCHIVE"

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          NOTES="RELEASE_NOTES_v$VERSION.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" /tmp/release-notes.md
          else
            printf '# Gen1Follower %s\n\nSandbox-compatible release.\n' "$VERSION" > /tmp/release-notes.md
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" --clobber
            gh release edit "$TAG" \
              --title "Gen1Follower $VERSION" \
              --notes-file /tmp/release-notes.md \
              --latest
          else
            gh release create "$TAG" "$ARCHIVE" \
              --target "$GITHUB_SHA" \
              --title "Gen1Follower $VERSION" \
              --notes-file /tmp/release-notes.md \
              --latest
          fi

      - name: Prune stale release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail
          # A mod index that substring-matches the mod id against release asset
          # names can resolve a leftover archive from an earlier build in
          # preference to this one, serving stale code. The release should hold
          # exactly what this run produced, so drop everything else on the tag.
          gh release view "$TAG" --json assets --jq '.assets[].name' > /tmp/assets.txt
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            if [ "$name" != "$ARCHIVE" ]; then
              echo "removing stale asset: $name"
              gh release delete-asset "$TAG" "$name" --yes
            fi
          done < /tmp/assets.txt
          echo "assets now on $TAG:"
          gh release view "$TAG" --json assets --jq '.assets[] | "  \(.name)  \(.size) bytes"'
